org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.4 usa por defecto el DSL nuevo y el soporte de Kotlin integrado. Este
# proyecto se escribió para el modelo clásico (plugin kotlin.android + plugins
# de Compose y Serialization de JetBrains), así que se desactivan ambos: es la
# vía de escape documentada por Google (android.newDsl / android.builtInKotlin).
# Migrar al DSL nuevo es trabajo de una tarea aparte, no de la primera compilación.
android.newDsl=false
android.builtInKotlin=false

kotlin.code.style=official
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
android.experimental.disableCompileSdkChecks=true
